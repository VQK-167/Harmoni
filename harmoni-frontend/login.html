<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập – Harmoni</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-visual">
      <a href="index.html" class="harmoni-logo mb-5" style="filter:brightness(0) invert(1);">
        <img src="assets/images/logo.svg" alt="Harmoni">
      </a>
      <p class="quote">"Những kết nối đẹp nhất bắt đầu từ sự đồng điệu."</p>
      <p class="text-white-75 mt-3">Đăng nhập để tiếp tục khám phá những người phù hợp với bạn.</p>
    </div>

    <div class="auth-form-side">
      <div class="auth-card" id="loginCard">
        <a href="index.html" class="harmoni-logo d-lg-none mb-4"><img src="assets/images/logo.svg" alt="Harmoni"></a>
        <h3>Chào mừng trở lại</h3>
        <p class="mb-4">Đăng nhập để tiếp tục kết nối trên Harmoni.</p>

        <div id="loginAlert" class="alert d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group-hm mb-3">
            <label class="form-label" for="loginEmail">Email</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="ten@email.com" required>
            <div class="invalid-feedback"></div>
          </div>

          <div class="form-group-hm mb-3">
            <label class="form-label" for="loginPassword">Mật khẩu</label>
            <div class="password-field">
              <input type="password" class="form-control" id="loginPassword" placeholder="Nhập mật khẩu" required>
              <button type="button" class="password-toggle-btn" data-toggle-password="loginPassword">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback"></div>
          </div>

          <button type="submit" class="btn btn-gradient w-100 btn-lg mb-3">Đăng nhập</button>

          <div class="auth-demo-hint">
            <i class="bi bi-info-circle me-1"></i>
            Tài khoản demo: <strong>khang@harmoni.vn</strong> / <strong>Harmoni@123</strong>
          </div>
        </form>

        <p class="text-center mt-4 mb-0">
          Chưa có tài khoản? <a href="register.html" class="fw-bold">Đăng ký ngay</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    HarmoniAuth.initLoginForm();
  </script>
</body>
</html>
