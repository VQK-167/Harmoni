<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo hồ sơ – Harmoni</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-hm-bg">

  <div class="container py-5" id="onboardingRoot">
    <div class="onboarding-wrapper">
      <div class="text-center mb-4">
        <a href="index.html" class="harmoni-logo justify-content-center mb-3"><img src="assets/images/logo.svg" alt="Harmoni"></a>
        <h3>Tạo hồ sơ của bạn</h3>
        <p>Chỉ vài bước nữa để bắt đầu khám phá những người đồng điệu.</p>
      </div>

      <div class="step-indicator">
        <span class="dot active" data-step-dot="1"></span>
        <span class="dot" data-step-dot="2"></span>
        <span class="dot" data-step-dot="3"></span>
      </div>
      <div class="onboarding-progress mb-2"><div class="bar" id="onboardingBar" style="width:0%"></div></div>
      <p class="text-center small text-secondary-hm mb-4" id="stepLabel">Bước 1 / 3</p>

      <div class="onboarding-card card-hm">

        <!-- STEP 1: Thông tin cơ bản -->
        <div id="step-1">
          <h5 class="mb-3"><i class="bi bi-person-badge me-2 text-gradient"></i>Thông tin cơ bản</h5>

          <div class="mb-3">
            <label class="form-label" for="obName">Tên hiển thị</label>
            <input type="text" class="form-control" id="obName" placeholder="Ví dụ: Lê Minh Khang">
            <div class="small text-danger ob-error d-none" id="obNameError"></div>
          </div>

          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label" for="obDob">Ngày sinh</label>
              <input type="date" class="form-control" id="obDob">
              <div class="small text-danger ob-error d-none" id="obDobError"></div>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="obCity">Thành phố</label>
              <input type="text" class="form-control" id="obCity" placeholder="Ví dụ: Hà Nội">
              <div class="small text-danger ob-error d-none" id="obCityError"></div>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label d-block">Giới tính</label>
            <div class="d-flex gap-3 flex-wrap">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="obGender" id="obGenderMale" value="male">
                <label class="form-check-label" for="obGenderMale">Nam</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="obGender" id="obGenderFemale" value="female">
                <label class="form-check-label" for="obGenderFemale">Nữ</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="obGender" id="obGenderOther" value="other">
                <label class="form-check-label" for="obGenderOther">Khác</label>
              </div>
            </div>
            <div class="small text-danger ob-error d-none" id="obGenderError"></div>
          </div>
        </div>

        <!-- STEP 2: Giới thiệu bản thân -->
        <div id="step-2" class="d-none">
          <h5 class="mb-3"><i class="bi bi-chat-square-text me-2 text-gradient"></i>Giới thiệu bản thân</h5>

          <div class="mb-3">
            <label class="form-label" for="obBio">Giới thiệu ngắn (bio)</label>
            <textarea class="form-control" id="obBio" rows="4" placeholder="Chia sẻ một chút về bạn, điều bạn thích, điều bạn đang tìm kiếm..."></textarea>
            <div class="small text-danger ob-error d-none" id="obBioError"></div>
          </div>

          <div>
            <label class="form-label d-block">Mục đích kết nối</label>
            <div class="d-flex flex-column gap-2">
              <label class="interest-chip static" style="width:100%; justify-content:flex-start; cursor:pointer;">
                <input class="form-check-input me-2" type="radio" name="obPurpose" value="friend"> Kết bạn
              </label>
              <label class="interest-chip static" style="width:100%; justify-content:flex-start; cursor:pointer;">
                <input class="form-check-input me-2" type="radio" name="obPurpose" value="dating"> Hẹn hò
              </label>
              <label class="interest-chip static" style="width:100%; justify-content:flex-start; cursor:pointer;">
                <input class="form-check-input me-2" type="radio" name="obPurpose" value="longterm"> Tìm mối quan hệ lâu dài
              </label>
            </div>
            <div class="small text-danger ob-error d-none" id="obPurposeError"></div>
          </div>
        </div>

        <!-- STEP 3: Sở thích -->
        <div id="step-3" class="d-none">
          <h5 class="mb-1"><i class="bi bi-heart me-2 text-gradient"></i>Sở thích của bạn</h5>
          <p class="small mb-3">Chọn ít nhất 3 sở thích để Harmoni tìm người đồng điệu với bạn (<span id="selectedInterestCount">0</span> đã chọn).</p>

          <div class="d-flex flex-wrap gap-2" id="interestChipList"></div>
          <div class="small text-danger ob-error d-none mt-2" id="obInterestsError"></div>

          <hr class="my-3">
          <p class="small fw-bold mb-2">Sở thích đã chọn:</p>
          <div class="d-flex flex-wrap gap-2" id="selectedInterestSummary"></div>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <button type="button" class="btn btn-outline-hm invisible" data-step-back>
            <i class="bi bi-arrow-left me-1"></i> Quay lại
          </button>
          <button type="button" class="btn btn-gradient" data-step-next>Tiếp tục</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/profile.js"></script>
  <script>
    HarmoniProfile.initCreateProfile();
  </script>
</body>
</html>
