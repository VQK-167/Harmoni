<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỉnh sửa hồ sơ – Harmoni</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar">
      <a href="discover.html" class="harmoni-logo"><img src="assets/images/logo.svg" alt="Harmoni"></a>
      <nav class="sidebar-nav">
        <a href="discover.html" class="nav-item-hm" data-nav="discover"><i class="bi bi-compass"></i> Khám phá</a>
        <a href="matches.html" class="nav-item-hm" data-nav="matches"><i class="bi bi-heart"></i> Kết nối của tôi</a>
        <a href="messages.html" class="nav-item-hm" data-nav="messages"><i class="bi bi-chat-dots"></i> Tin nhắn</a>
        <a href="profile.html" class="nav-item-hm" data-nav="profile"><i class="bi bi-person-circle"></i> Hồ sơ cá nhân</a>
        <a href="settings.html" class="nav-item-hm" data-nav="settings"><i class="bi bi-gear"></i> Cài đặt</a>
      </nav>
      <div class="sidebar-user-card">
        <img data-current-user-avatar src="assets/images/default-avatar.svg" alt="">
        <div class="name" data-current-user-name>Người dùng</div>
        <a href="#" class="btn-ghost-hm ms-auto p-2" data-action="logout" title="Đăng xuất"><i class="bi bi-box-arrow-right"></i></a>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="sidebar-toggle-btn" data-action="toggle-sidebar"><i class="bi bi-list"></i></button>
          <h1 class="page-title">Chỉnh sửa hồ sơ</h1>
        </div>
        <div class="dropdown topbar-user-menu">
          <a href="#" class="d-flex align-items-center gap-2" data-bs-toggle="dropdown">
            <img data-current-user-avatar src="assets/images/default-avatar.svg" alt="">
            <span class="fw-bold d-none d-sm-inline" data-current-user-name>Người dùng</span>
            <i class="bi bi-chevron-down small"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Hồ sơ cá nhân</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#" data-action="logout"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
          </ul>
        </div>
      </header>

      <main class="app-content" id="editProfileRoot">
        <div class="row g-4">
          <div class="col-lg-8 mx-auto">
            <div class="card-hm profile-section-card fade-in-up">

              <div id="editProfileAlert" class="alert d-none" role="alert"></div>

              <form id="editProfileForm" novalidate>
                <h6 class="fw-bold mb-3">Thông tin cơ bản</h6>
                <div class="mb-3">
                  <label class="form-label" for="epName">Tên hiển thị</label>
                  <input type="text" class="form-control" id="epName">
                </div>
                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label" for="epDob">Ngày sinh</label>
                    <input type="date" class="form-control" id="epDob">
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label" for="epCity">Thành phố</label>
                    <input type="text" class="form-control" id="epCity">
                  </div>
                </div>
                <div class="mb-4">
                  <label class="form-label d-block">Giới tính</label>
                  <div class="d-flex gap-3 flex-wrap">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="epGender" id="epGenderMale" value="male">
                      <label class="form-check-label" for="epGenderMale">Nam</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="epGender" id="epGenderFemale" value="female">
                      <label class="form-check-label" for="epGenderFemale">Nữ</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="epGender" id="epGenderOther" value="other">
                      <label class="form-check-label" for="epGenderOther">Khác</label>
                    </div>
                  </div>
                </div>

                <hr class="my-4">

                <h6 class="fw-bold mb-3">Giới thiệu bản thân</h6>
                <div class="mb-3">
                  <label class="form-label" for="epBio">Bio</label>
                  <textarea class="form-control" id="epBio" rows="4"></textarea>
                </div>
                <div class="mb-4">
                  <label class="form-label d-block">Mục đích kết nối</label>
                  <div class="d-flex flex-column gap-2">
                    <label class="interest-chip static" style="width:100%; justify-content:flex-start; cursor:pointer;">
                      <input class="form-check-input me-2" type="radio" name="epPurpose" value="friend"> Kết bạn
                    </label>
                    <label class="interest-chip static" style="width:100%; justify-content:flex-start; cursor:pointer;">
                      <input class="form-check-input me-2" type="radio" name="epPurpose" value="dating"> Hẹn hò
                    </label>
                    <label class="interest-chip static" style="width:100%; justify-content:flex-start; cursor:pointer;">
                      <input class="form-check-input me-2" type="radio" name="epPurpose" value="longterm"> Tìm mối quan hệ lâu dài
                    </label>
                  </div>
                </div>

                <hr class="my-4">

                <h6 class="fw-bold mb-2">Sở thích</h6>
                <p class="small text-secondary-hm mb-2">Chọn ít nhất 3 sở thích.</p>
                <div class="d-flex flex-wrap gap-2 mb-4" id="epInterestChipList"></div>

                <div class="d-flex gap-3">
                  <button type="submit" class="btn btn-gradient px-4">Lưu thay đổi</button>
                  <button type="button" class="btn btn-outline-hm px-4" id="editProfileCancelBtn">Hủy</button>
                </div>
              </form>

            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="discover.html" class="nav-item-hm" data-nav="discover"><i class="bi bi-compass"></i>Khám phá</a>
    <a href="matches.html" class="nav-item-hm" data-nav="matches"><i class="bi bi-heart"></i>Kết nối</a>
    <a href="messages.html" class="nav-item-hm" data-nav="messages"><i class="bi bi-chat-dots"></i>Tin nhắn</a>
    <a href="profile.html" class="nav-item-hm" data-nav="profile"><i class="bi bi-person-circle"></i>Hồ sơ</a>
    <a href="settings.html" class="nav-item-hm" data-nav="settings"><i class="bi bi-gear"></i>Cài đặt</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/profile.js"></script>
  <script>
    HarmoniApp.initAppShell('profile');
    HarmoniProfile.initEditProfile();
  </script>
</body>
</html>
