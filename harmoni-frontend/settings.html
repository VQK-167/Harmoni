<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt – Harmoni</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div class="app-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>
    <aside class="sidebar">
      <a href="discover.html" class="harmoni-logo"><img src="assets/images/logo.svg" alt="Harmoni"></a>
      <nav class="sidebar-nav">
        <a href="discover.html" class="nav-item-hm" data-nav="discover"><i class="bi bi-compass"></i> Khám phá</a>
        <a href="matches.html" class="nav-item-hm" data-nav="matches"><i class="bi bi-heart"></i> Kết nối của tôi</a>
        <a href="messages.html" class="nav-item-hm" data-nav="messages"><i class="bi bi-chat-dots"></i> Tin nhắn</a>
        <a href="profile.html" class="nav-item-hm" data-nav="profile"><i class="bi bi-person-circle"></i> Hồ sơ cá nhân</a>
        <a href="settings.html" class="nav-item-hm" data-nav="settings"><i class="bi bi-gear"></i> Cài đặt</a>
      </nav>
      <div class="sidebar-user-card">
        <img data-current-user-avatar src="assets/images/default-avatar.svg" alt="">
        <div class="name" data-current-user-name>Người dùng</div>
        <a href="#" class="btn-ghost-hm ms-auto p-2" data-action="logout" title="Đăng xuất"><i class="bi bi-box-arrow-right"></i></a>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="sidebar-toggle-btn" data-action="toggle-sidebar"><i class="bi bi-list"></i></button>
          <h1 class="page-title">Cài đặt</h1>
        </div>
        <div class="dropdown topbar-user-menu">
          <a href="#" class="d-flex align-items-center gap-2" data-bs-toggle="dropdown">
            <img data-current-user-avatar src="assets/images/default-avatar.svg" alt="">
            <span class="fw-bold d-none d-sm-inline" data-current-user-name>Người dùng</span>
            <i class="bi bi-chevron-down small"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Hồ sơ cá nhân</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#" data-action="logout"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
          </ul>
        </div>
      </header>

      <main class="app-content">
        <div class="row g-4">
          <div class="col-lg-7 mx-auto">

            <div class="card-hm profile-section-card fade-in-up settings-list">
              <h6 class="fw-bold mb-3">Thông tin tài khoản</h6>
              <div class="list-item">
                <div><i class="bi bi-envelope lead-icon"></i>Email</div>
                <span class="text-secondary-hm" id="settingsEmail">—</span>
              </div>
              <a href="profile.html" class="list-item text-decoration-none text-reset">
                <div><i class="bi bi-person lead-icon"></i>Hồ sơ cá nhân</div>
                <i class="bi bi-chevron-right text-secondary-hm"></i>
              </a>
              <a href="safety.html" class="list-item text-decoration-none text-reset">
                <div><i class="bi bi-shield-check lead-icon"></i>An toàn & danh sách chặn</div>
                <i class="bi bi-chevron-right text-secondary-hm"></i>
              </a>
            </div>

            <div class="card-hm profile-section-card mt-4 fade-in-up">
              <button type="button" class="btn btn-danger-hm w-100" data-action="logout">
                <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
              </button>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="discover.html" class="nav-item-hm" data-nav="discover"><i class="bi bi-compass"></i>Khám phá</a>
    <a href="matches.html" class="nav-item-hm" data-nav="matches"><i class="bi bi-heart"></i>Kết nối</a>
    <a href="messages.html" class="nav-item-hm" data-nav="messages"><i class="bi bi-chat-dots"></i>Tin nhắn</a>
    <a href="profile.html" class="nav-item-hm" data-nav="profile"><i class="bi bi-person-circle"></i>Hồ sơ</a>
    <a href="settings.html" class="nav-item-hm" data-nav="settings"><i class="bi bi-gear"></i>Cài đặt</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (async function () {
      if (HarmoniApp.requireAuth() && (await HarmoniApp.requireProfile())) {
        HarmoniApp.initAppShell('settings');
        var user = HarmoniStore.getCurrentUser();
        document.getElementById('settingsEmail').textContent = user ? user.email : '—';
      }
    })();
  </script>
</body>
</html>
